spring.application.name=GastroManager
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl

server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.web.servlet.error=DEBUG




#h2 configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:gestioneventosdb
spring.datasource.username=sa
spring.datasource.password=admin1234
spring.datasource.driverClassname=org.h2.Driver

#env

jwt.secret=ClaveSecretParaFirmarTusJWTTokensYQueNadieLosFalsifiqueEsImportanteUnaMuay
jwt.expiration=600000
